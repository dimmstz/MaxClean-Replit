name: Android APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  release:
    types:
      - published
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: CI=1 pnpm --filter @workspace/mobile exec expo prebuild --platform android --no-install --clean

      - name: Set Android SDK location
        run: echo "sdk.dir=$ANDROID_HOME" > artifacts/mobile/android/local.properties

      - name: Build APK
        working-directory: artifacts/mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maxclean-android-debug-apk
          path: artifacts/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  attach-release-apk:
    name: Attach APK to GitHub Release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: maxclean-android-debug-apk
          path: release-assets

      - name: Publish APK on the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(find release-assets -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$apk" \
              --title "MaxClean $GITHUB_REF_NAME" \
              --generate-notes
          fi
